[project]
name = "bilibili-food-mcp"
version = "0.1.0"
description = "B站探店视频深度解析与 Agent MCP 服务"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # B站API
    "bilibili-api-python>=16.3.0",
    "curl-cffi>=0.15.0",  # TLS指纹伪装，绕过B站412风控

    # ASR / 语音识别
    "openai-whisper>=20240930",

    # LLM 客户端
    "openai>=1.30.0",
    "httpx>=0.27.0",

    # 数据模型 & 配置
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # 数据库驱动
    "neo4j>=5.20.0",
    "psycopg[binary]>=3.1.0",
    "pymilvus>=2.4.0",

    # 地理与字符串匹配
    "rapidfuzz>=3.0.0",

    # MCP SDK
    "mcp>=1.0.0",

    # 工具库
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "tenacity>=8.3.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
food-pipeline = "scripts.run_pipeline:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
